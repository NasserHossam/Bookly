spring.application.name=book-store

# Database (override with environment variables in any non-local environment)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/bookstore?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT signing key (min. 32 characters). The default is for LOCAL DEVELOPMENT ONLY -
# always set JWT_SECRET to your own random value when deploying anywhere.
jwt.secret=${JWT_SECRET:local-dev-only-change-me-please-0123456789abcdef}

server.port=8080
