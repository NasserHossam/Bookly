<div class="auth-page">
  <div class="auth-card card">
    <div class="auth-header">
      <i class="fa-solid fa-book-open"></i>
      <h2>Welcome to BOOKLY</h2>
      <p>Login to continue your reading journey</p>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
      <div class="form-group">
        <label for="email">Email</label>
        <input id="email" type="email" formControlName="email" placeholder="you@example.com" />
        @if (form.get('email')?.touched && form.get('email')?.invalid) {
          <div class="error-text">Please enter a valid email</div>
        }
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input id="password" type="password" formControlName="password" placeholder="Your password" />
        @if (form.get('password')?.touched && form.get('password')?.invalid) {
          <div class="error-text">Password is required</div>
        }
      </div>

      <button type="submit" class="btn btn-primary full-width" [disabled]="loading">
        @if (loading) {
          <span class="spinner"></span> Logging in...
        } @else {
          Login
        }
      </button>
    </form>

    <p class="switch-auth">Don't have an account? <a routerLink="/signup">Sign up</a></p>
  </div>
</div>
